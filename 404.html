<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page introuvable — Yuri Bausch</title>
  <link rel="icon" href="/portfolio/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/portfolio/assets/favicon.svg" />
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg:#0b0b0c; --ink:#ecebe6; --soft:#8f8d87; --rec:#ff3b30; }
    * { margin:0; box-sizing:border-box; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:radial-gradient(60% 60% at 20% 20%, rgba(63,208,201,.12), transparent 70%),
                 radial-gradient(60% 60% at 85% 85%, rgba(255,138,61,.12), transparent 70%), var(--bg);
      color:var(--ink); font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align:center; padding:2rem;
    }
    .wrap { max-width:520px; }
    .tag {
      font-family:ui-monospace, Consolas, monospace; font-size:.75rem; letter-spacing:.25em;
      text-transform:uppercase; color:var(--rec); display:inline-flex; gap:.5rem; align-items:center;
    }
    .tag::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--rec); animation:b 1s infinite; }
    @keyframes b { 50% { opacity:.15; } }
    .code { font-weight:900; font-size:clamp(5rem,20vw,10rem); line-height:.9; letter-spacing:-3px; margin-top:1rem; }
    .code span { color:transparent; -webkit-text-stroke:2px var(--ink); }
    h1 { font-size:clamp(1.3rem,4vw,1.8rem); margin:1rem 0 .6rem; }
    p { color:var(--soft); margin-bottom:2rem; font-size:1.05rem; }
    a {
      display:inline-flex; align-items:center; gap:.5rem;
      background:var(--ink); color:var(--bg); text-decoration:none;
      font-family:ui-monospace, Consolas, monospace; font-weight:700; font-size:.85rem;
      letter-spacing:.08em; text-transform:uppercase;
      padding:.85rem 1.4rem; border-radius:4px; border:1px solid var(--ink);
      transition:background .2s, color .2s, transform .2s;
    }
    a:hover { background:var(--rec); border-color:var(--rec); color:#fff; transform:translateY(-2px); }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="tag">Coupez ! Plan manquant</span>
    <div class="code">4<span>0</span>4</div>
    <h1>Cette page n'existe pas</h1>
    <p>Le lien est peut-être cassé ou la page a été déplacée.</p>
    <a href="/portfolio/">← Retour au portfolio</a>
  </div>
</body>
</html>
